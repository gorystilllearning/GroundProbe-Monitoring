<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="term-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer container with glow -->
  <rect x="20" y="20" width="760" height="200" rx="12" fill="url(#term-bg)" stroke="#4f46e5" stroke-width="1.5" filter="url(#term-glow)" />

  <!-- macOS Window Controls -->
  <circle cx="45" cy="45" r="6" fill="#ff5f56" />
  <circle cx="65" cy="45" r="6" fill="#ffbd2e" />
  <circle cx="85" cy="45" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <rect x="120" y="32" width="220" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="135" y="50" font-family="monospace" font-size="12" fill="#818cf8">$ bash | start-monitoring</text>

  <!-- Terminal Content -->
  <g font-family="monospace" font-size="14" fill="#cbd5e1">
    <!-- Line 1 -->
    <text x="45" y="95" fill="#a855f7" font-weight="bold">❯</text>
    <text x="65" y="95">git clone https://github.com/gorystilllearning/GroundProbe-Monitoring.git</text>
    
    <!-- Line 2 -->
    <text x="45" y="125" fill="#a855f7" font-weight="bold">❯</text>
    <text x="65" y="125">cd GroundProbe-Monitoring</text>
    
    <!-- Line 3 -->
    <text x="45" y="155" fill="#a855f7" font-weight="bold">❯</text>
    <text x="65" y="155">docker compose up -d</text>
    
    <!-- Line 4 -->
    <text x="45" y="185" fill="#22c55e">✔</text>
    <text x="65" y="185" fill="#94a3b8">Network groundprobe-monitoring_default Created</text>
    
    <!-- Line 5 -->
    <text x="45" y="205" fill="#22c55e">✔</text>
    <text x="65" y="205" fill="#94a3b8">Container groundprobe-zabbix-web Started</text>
  </g>
</svg>
